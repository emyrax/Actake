[package]
name = "actake_escrow"
version = "0.1.0"
description = "Actake trustless SPL / Token-2022 habit accountability escrow with Ed25519 oracle introspection"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "actake_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = { version = "0.30.1", features = ["token", "token_2022"] }
